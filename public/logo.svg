<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 140" width="520" height="140">
  <defs>
    <linearGradient id="waxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35"/>
      <stop offset="100%" style="stop-color:#E63946"/>
    </linearGradient>
    <linearGradient id="vinylShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="30%" style="stop-color:#2B2D42"/>
      <stop offset="70%" style="stop-color:#2B2D42"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
  </defs>

  <!-- Vinyl Record Icon -->
  <g transform="translate(70, 70)">
    <!-- Outer ring with stronger contrast -->
    <circle cx="0" cy="0" r="55" fill="url(#vinylShine)" stroke="#0a0a0a" stroke-width="2"/>
    <!-- Grooves - more visible -->
    <circle cx="0" cy="0" r="48" fill="none" stroke="#404258" stroke-width="0.8" opacity="0.7"/>
    <circle cx="0" cy="0" r="42" fill="none" stroke="#404258" stroke-width="0.8" opacity="0.7"/>
    <circle cx="0" cy="0" r="36" fill="none" stroke="#404258" stroke-width="0.8" opacity="0.7"/>
    <circle cx="0" cy="0" r="30" fill="none" stroke="#404258" stroke-width="0.8" opacity="0.7"/>
    <!-- Gradient label area - bigger and brighter -->
    <circle cx="0" cy="0" r="22" fill="url(#waxGrad)"/>
    <!-- Highlight on label -->
    <circle cx="0" cy="0" r="18" fill="none" stroke="#fff" stroke-width="1" opacity="0.4"/>
    <!-- Spindle hole -->
    <circle cx="0" cy="0" r="3.5" fill="#0a0a0a"/>

    <!-- Tour route visualization - thicker and more vibrant -->
    <path d="M 12 -12 Q 35 -40 60 -35 Q 90 -28 110 -12"
          fill="none" stroke="url(#waxGrad)" stroke-width="4" stroke-linecap="round"
          stroke-dasharray="5 8" opacity="0.9"/>
    <!-- Route stops - larger dots -->
    <circle cx="60" cy="-35" r="5" fill="#FF6B35">
      <animate attributeName="opacity" values="1;0.6;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="90" cy="-25" r="4.5" fill="#E63946">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="110" cy="-12" r="5" fill="#FF6B35">
      <animate attributeName="opacity" values="1;0.6;1" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Wordmark - centered and cleaner -->
  <g transform="translate(150, 50)">
    <!-- TOUR -->
    <text x="0" y="35" font-family="'Helvetica Neue', 'Arial Black', Helvetica, sans-serif"
          font-weight="900" font-size="52" letter-spacing="-1.5" fill="#2B2D42"
          text-rendering="geometricPrecision">TOUR</text>
    <!-- WAX with gradient -->
    <text x="160" y="35" font-family="'Helvetica Neue', 'Arial Black', Helvetica, sans-serif"
          font-weight="900" font-size="52" letter-spacing="-1.5" fill="url(#waxGrad)"
          text-rendering="geometricPrecision">WAX</text>

    <!-- Tagline - larger, darker, more visible -->
    <text x="2" y="58" font-family="'Helvetica Neue', Helvetica, sans-serif"
          font-weight="600" font-size="11" letter-spacing="3.5" fill="#6B7280"
          text-rendering="geometricPrecision">LIVE MUSIC TOURS &amp; NEWS</text>
  </g>

  <!-- Accent bar under wordmark -->
  <rect x="150" y="110" width="140" height="3" rx="1.5" fill="url(#waxGrad)" opacity="0.8"/>
</svg>
