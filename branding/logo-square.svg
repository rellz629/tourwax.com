<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="waxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35"/>
      <stop offset="100%" style="stop-color:#E63946"/>
    </linearGradient>
    <linearGradient id="vinylShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="30%" style="stop-color:#2B2D42"/>
      <stop offset="70%" style="stop-color:#2B2D42"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="#1a1a2e"/>

  <g transform="translate(256, 256)">
    <!-- Outer ring -->
    <circle cx="0" cy="0" r="190" fill="url(#vinylShine)" stroke="#0a0a0a" stroke-width="6"/>
    <!-- Grooves -->
    <circle cx="0" cy="0" r="166" fill="none" stroke="#404258" stroke-width="2.5" opacity="0.7"/>
    <circle cx="0" cy="0" r="145" fill="none" stroke="#404258" stroke-width="2.5" opacity="0.7"/>
    <circle cx="0" cy="0" r="124" fill="none" stroke="#404258" stroke-width="2.5" opacity="0.7"/>
    <circle cx="0" cy="0" r="103" fill="none" stroke="#404258" stroke-width="2.5" opacity="0.7"/>
    <!-- Gradient label -->
    <circle cx="0" cy="0" r="76" fill="url(#waxGrad)"/>
    <!-- Label highlight -->
    <circle cx="0" cy="0" r="62" fill="none" stroke="#fff" stroke-width="3" opacity="0.4"/>
    <!-- Spindle hole -->
    <circle cx="0" cy="0" r="12" fill="#0a0a0a"/>
  </g>
</svg>
